[project]
name = "app"
version = "0.1.0"
description = "Workshop for PyCon Chile 2026"
readme = "README.md"
authors = [{ name = "pablonoya", email = "pablonoya18@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["fastapi[standard]>=0.162.2"]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"


[tool.fastapi]
entrypoint = "app.main:app"
